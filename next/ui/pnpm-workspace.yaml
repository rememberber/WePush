packages:
  - apps/*
  - packages/*

# pnpm blocks dependency lifecycle scripts unless they are explicitly trusted.
# Electron's pinned postinstall downloads and verifies the native runtime that
# the Desktop packager copies into the release bundle.
onlyBuiltDependencies:
  - electron

catalog:
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@vitejs/plugin-react': 6.1.0
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: 4.3.3
  typescript: 6.0.3
  vite: 8.1.5
  vitest: 4.1.11
