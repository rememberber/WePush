packages:
  - apps/*
  - packages/*

# pnpm 11 ignores legacy onlyBuiltDependencies and fails the install when a
# dependency build script is not listed here. Electron's postinstall downloads
# the native runtime copied into the Desktop bundle. esbuild's postinstall
# installs the platform binary used by Vite.
allowBuilds:
  electron: true
  esbuild: true

catalog:
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@vitejs/plugin-react': 6.1.0
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: 4.3.3
  typescript: 6.0.3
  vite: 8.1.5
  vitest: 4.1.11
