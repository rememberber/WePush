        enabled: {type: boolean, default: true}
    UpdateSchedule:
      type: object
      properties:
        name: {type: string}
        jobId: {type: string}
        cronExpression: {type: string, description: Spring six-field cron expression}
        timezone: {type: string}
        misfirePolicy: {type: string, enum: [FIRE_ONCE, SKIP]}
        enabled: {type: boolean}
    Schedule:
      type: object
      required: [id, workspaceId, jobId, name, cronExpression, timezone, misfirePolicy, enabled,
