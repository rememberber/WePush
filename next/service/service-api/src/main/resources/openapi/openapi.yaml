      properties:
        id: {type: string}
        workspaceId: {type: string}
        jobId: {type: string}
        name: {type: string}
        cronExpression: {type: string}
        timezone: {type: string}
        misfirePolicy: {type: string, enum: [FIRE_ONCE, SKIP]}
        enabled: {type: boolean}
