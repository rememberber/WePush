openapi: 3.1.0
info:
  title: WePush Next Service API
  version: 0.1.0-beta.1
  description: Self-hosted control plane API shared by Web UI, Desktop UI and remote SDKs. It does not expose SaaS registration, billing, subscription or public-cloud platform services.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - {name: System}
  - {name: Providers}
  - {name: Agents}
  - {name: Accounts}
  - {name: Secrets}
  - {name: Messages}
  - {name: Audiences}
  - {name: Jobs}
  - {name: Runs}
  - {name: Artifacts}
  - {name: Schedules}
  - {name: Security}
  - {name: Agent Internal}
paths:
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      tags: [System]
      security: []
      responses:
        '200':
          description: Current Service identity and time
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemInfo'}
  /api/v1/workspaces/{workspaceId}/api-tokens:
    get:
      operationId: listApiTokens
      tags: [Security]
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200':
          description: API Token metadata; clear token values are never returned
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ApiTokenSummary'}}}}
    post:
      operationId: createApiToken
      tags: [Security]
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateApiToken'}}}
      responses:
        '201':
          description: Token issued; the clear token is returned exactly once
          content: {application/json: {schema: {$ref: '#/components/schemas/IssuedApiToken'}}}
  /api/v1/workspaces/{workspaceId}/api-tokens/{tokenId}:
    delete:
      operationId: revokeApiToken
      tags: [Security]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: tokenId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Token revoked}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/workspaces/{workspaceId}/agent-enrollment-tokens:
    post:
      operationId: createAgentEnrollmentToken
      tags: [Security, Agents]
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateEnrollmentToken'}}}
      responses:
        '201':
          description: One-time Agent enrollment token
          content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentToken'}}}
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      tags: [Security]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Workspaces, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Workspace'}}}}}
    post:
      operationId: createWorkspace
      tags: [Security]
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateWorkspace'}}}}
      responses:
        '201': {description: Workspace created, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
  /api/v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      tags: [Security]
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {description: Workspace, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
  /api/v1/providers:
    get:
      operationId: listProviders
      tags: [Providers]
      responses:
        '200':
          description: Installed and active Provider versions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProviderSummary'}
  /api/v1/providers/{providerId}/versions/{version}/schemas/{schemaKind}:
    get:
      operationId: getProviderSchema
      tags: [Providers]
      parameters:
        - {$ref: '#/components/parameters/ProviderId'}
        - {$ref: '#/components/parameters/ProviderVersion'}
        - name: schemaKind
          in: path
          required: true
          schema: {type: string, enum: [account, message, recipient]}
      responses:
        '200':
          description: Provider JSON Schema
          content:
            application/schema+json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/agents:
    get:
      operationId: listAgents
      tags: [Agents]
      responses:
        '200':
          description: Registered Agent sessions and their current heartbeat state
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Agent'}}
  /api/v1/agents/{agentId}:
    get:
      operationId: getAgent
      tags: [Agents]
      parameters:
        - {name: agentId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Agent session, capacity and Provider capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/workspaces/{workspaceId}/accounts:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      operationId: listAccounts
      tags: [Accounts]
      parameters: &ResourcePageParameters
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
        - {$ref: '#/components/parameters/NameQuery'}
        - {$ref: '#/components/parameters/StatusQuery'}
        - {$ref: '#/components/parameters/FromQuery'}
        - {$ref: '#/components/parameters/ToQuery'}
      responses:
        '200': {$ref: '#/components/responses/AccountList'}
    post:
      operationId: createAccount
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAccount'}
      responses:
        '201':
          description: Account created
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/workspaces/{workspaceId}/accounts/{accountId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {name: accountId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getAccount
      tags: [Accounts]
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateAccount
      tags: [Accounts]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAccount'}}}}
      responses:
        '200': {description: Account updated, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/workspaces/{workspaceId}/accounts/{accountId}/connection-test:
    post:
      operationId: testAccountConnection
      tags: [Accounts]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: accountId, in: path, required: true, schema: {type: string}}
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionTestRequest'}}}}
      responses:
        '200': {description: Provider connection result, content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionTest'}}}}
  /api/v1/workspaces/{workspaceId}/secrets/{namespace}/{name}/versions/{version}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {name: namespace, in: path, required: true, schema: {type: string}}
      - {name: name, in: path, required: true, schema: {type: string}}
      - {name: version, in: path, required: true, schema: {type: string}}
    put:
      operationId: replaceSecret
      tags: [Secrets]
      description: Replaces a secret value. Plaintext is accepted write-only and is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SecretWrite'}
      responses:
        '200':
          description: Encrypted secret metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretMetadata'}
        '404': {$ref: '#/components/responses/NotFound'}
    get:
      operationId: getSecretMetadata
      tags: [Secrets]
      description: Returns configuration metadata only; secret plaintext is never readable through this API.
      responses:
        '200':
          description: Secret metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretMetadata'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/workspaces/{workspaceId}/messages:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      operationId: listMessages
      tags: [Messages]
      parameters: *ResourcePageParameters
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
    post:
      operationId: createMessage
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMessage'}
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/workspaces/{workspaceId}/messages/{messageId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {name: messageId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getMessage
      tags: [Messages]
      responses:
        '200':
          description: Message detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateMessage
      tags: [Messages]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMessage'}}}}
      responses:
        '200': {description: Message metadata updated or immutable revision created, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
  /api/v1/workspaces/{workspaceId}/messages/{messageId}/copy:
    post:
      operationId: copyMessage
      tags: [Messages]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: messageId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CopyResource'}}}}
      responses:
        '201': {description: Independent Message copy, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
  /api/v1/workspaces/{workspaceId}/messages/{messageId}/revisions:
    get:
      operationId: listMessageRevisions
      tags: [Messages]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: messageId, in: path, required: true, schema: {type: string}}
        - {name: beforeRevision, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: Bounded newest-first revision history, content: {application/json: {schema: {$ref: '#/components/schemas/MessageRevisionPage'}}}}
  /api/v1/workspaces/{workspaceId}/messages/{messageId}/diff:
    get:
      operationId: diffMessageRevisions
      tags: [Messages]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: messageId, in: path, required: true, schema: {type: string}}
        - {name: from, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: to, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Revision content and changed top-level paths, content: {application/json: {schema: {$ref: '#/components/schemas/MessageDiff'}}}}
  /api/v1/workspaces/{workspaceId}/audiences:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      operationId: listAudiences
      tags: [Audiences]
      parameters: *ResourcePageParameters
      responses:
        '200':
          description: Audiences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudiencePage'}
    post:
      operationId: createAudience
      tags: [Audiences]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAudience'}
      responses:
        '201':
          description: Audience and first immutable snapshot created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Audience'}
  /api/v1/workspaces/{workspaceId}/audiences/{audienceId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {name: audienceId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getAudience
      tags: [Audiences]
      responses:
        '200':
          description: Audience detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Audience'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateAudience
      tags: [Audiences]
      description: Metadata changes update the resource; replacing recipients creates a new immutable snapshot.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAudience'}}}}
      responses:
        '200': {description: Audience updated, content: {application/json: {schema: {$ref: '#/components/schemas/Audience'}}}}
  /api/v1/workspaces/{workspaceId}/audience-imports:
    post:
      operationId: uploadAudienceImport
      tags: [Audiences]
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name, format]
              properties:
                file: {type: string, format: binary}
                name: {type: string}
                audienceId: {type: string, description: Existing Audience to revise; omit to create one.}
                format: {type: string, enum: [CSV, TXT]}
                itemIdColumn: {type: string}
                fieldMapping: {type: string, description: JSON object mapping source columns to recipient fields.}
                delimiter: {type: string, minLength: 1, maxLength: 1}
      responses:
        '201': {description: Streamed import staged, deduplicated and ready for preview, content: {application/json: {schema: {$ref: '#/components/schemas/AudienceImport'}}}}
  /api/v1/workspaces/{workspaceId}/audience-imports/{importId}:
    get:
      operationId: getAudienceImport
      tags: [Audiences]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: importId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Import counters and bounded row previews, content: {application/json: {schema: {$ref: '#/components/schemas/AudienceImport'}}}}
  /api/v1/workspaces/{workspaceId}/audience-imports/{importId}/commit:
    post:
      operationId: commitAudienceImport
      tags: [Audiences]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: importId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: New immutable Audience snapshot committed, content: {application/json: {schema: {$ref: '#/components/schemas/Audience'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/workspaces/{workspaceId}/audience-imports/{importId}/errors.csv:
    get:
      operationId: downloadAudienceImportErrors
      tags: [Audiences]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: importId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Streamed rejected and duplicate rows, content: {text/csv: {schema: {type: string, format: binary}}}}
  /api/v1/workspaces/{workspaceId}/jobs:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      operationId: listJobs
      tags: [Jobs]
      parameters: *ResourcePageParameters
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPage'}
    post:
      operationId: createJob
      tags: [Jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateJob'}
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/workspaces/{workspaceId}/jobs/{jobId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {name: jobId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getJob
      tags: [Jobs]
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateJob
      tags: [Jobs]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateJob'}}}}
      responses:
        '200': {description: Job updated, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
  /api/v1/workspaces/{workspaceId}/jobs/{jobId}/copy:
    post:
      operationId: copyJob
      tags: [Jobs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: jobId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CopyResource'}}}}
      responses:
        '201': {description: Independent Job copy, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
  /api/v1/workspaces/{workspaceId}/jobs/{jobId}/run-confirmation:
    post:
      operationId: confirmLiveRun
      tags: [Runs]
      description: Returns the frozen live-send impact preview and a five-minute confirmation token.
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: jobId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Live-send confirmation context, content: {application/json: {schema: {$ref: '#/components/schemas/LiveConfirmation'}}}}
  /api/v1/workspaces/{workspaceId}/jobs/{jobId}/runs:
    post:
      operationId: createRun
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: jobId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRun'}
      responses:
        '202':
          description: Run accepted for asynchronous execution
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '200':
          description: Existing Run returned after idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/workspaces/{workspaceId}/schedules:
    parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
    get:
      operationId: listSchedules
      tags: [Schedules]
      parameters: *ResourcePageParameters
      responses:
        '200':
          description: Workspace schedules
          content: {application/json: {schema: {$ref: '#/components/schemas/SchedulePage'}}}
    post:
      operationId: createSchedule
      tags: [Schedules]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSchedule'}}}
      responses:
        '201':
          description: Schedule created
          content: {application/json: {schema: {$ref: '#/components/schemas/Schedule'}}}
  /api/v1/workspaces/{workspaceId}/schedules/{scheduleId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {name: scheduleId, in: path, required: true, schema: {type: string}}
    patch:
      operationId: updateSchedule
      tags: [Schedules]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSchedule'}}}
      responses:
        '200':
          description: Schedule definition updated and next fire time recalculated
          content: {application/json: {schema: {$ref: '#/components/schemas/Schedule'}}}
    delete:
      operationId: deleteSchedule
      tags: [Schedules]
      responses:
        '204': {description: Schedule deleted}
  /api/v1/workspaces/{workspaceId}/audit-events:
    get:
      operationId: listAuditEvents
      tags: [Security]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
        - {$ref: '#/components/parameters/NameQuery'}
        - {$ref: '#/components/parameters/StatusQuery'}
        - {$ref: '#/components/parameters/FromQuery'}
        - {$ref: '#/components/parameters/ToQuery'}
      responses:
        '200':
          description: Append-only security and mutation audit events
          content: {application/json: {schema: {$ref: '#/components/schemas/AuditEventPage'}}}
  /api/v1/workspaces/{workspaceId}/runs:
    get:
      operationId: listRuns
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
        - {$ref: '#/components/parameters/NameQuery'}
        - {$ref: '#/components/parameters/StatusQuery'}
        - {$ref: '#/components/parameters/FromQuery'}
        - {$ref: '#/components/parameters/ToQuery'}
      responses:
        '200':
          description: Runs ordered newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}:
    get:
      operationId: getRun
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: runId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current Run detail and counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/workspaces/{workspaceId}/overview:
    get:
      operationId: getRunOverview
      tags: [Runs]
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {description: Real Run totals, active/recent lists and 14-day trend, content: {application/json: {schema: {$ref: '#/components/schemas/RunOverview'}}}}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/retry-confirmation:
    post:
      operationId: confirmRunRetry
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/RunId'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RetryRequest'}}}}
      responses:
        '200': {description: Retryable item count and five-minute confirmation token, content: {application/json: {schema: {$ref: '#/components/schemas/RetryConfirmation'}}}}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/retries:
    post:
      operationId: retryRunItems
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RetryRequest'}}}}
      responses:
        '202': {description: Linked retry Run created from the source Run snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '200': {description: Idempotent retry replay, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/events:
    get:
      operationId: streamRunEvents
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: runId, in: path, required: true, schema: {type: string}}
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Persisted replay followed by live Run events. SSE id is the per-Run sequence.
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/RunEvent'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/items:
    get:
      operationId: listRunItemResults
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/RunId'}
        - name: cursor
          in: query
          required: false
          description: Opaque HMAC-protected cursor returned by the previous page.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Persisted final Item Results ordered by completion time and Item ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunItemResultPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/artifacts:
    get:
      operationId: listRunArtifacts
      tags: [Artifacts]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Non-deleted Artifacts associated with the Run
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Artifact'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/artifacts/result-export:
    post:
      operationId: createRunResultExport
      tags: [Artifacts]
      description: Creates a privacy-minimized CSV export for a terminal Run, or reuses its unexpired READY export.
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '201':
          description: Export created and ready to download
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
        '200':
          description: Existing unexpired READY export reused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/workspaces/{workspaceId}/artifacts/{artifactId}:
    get:
      operationId: getArtifact
      tags: [Artifacts]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/ArtifactId'}
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/workspaces/{workspaceId}/artifacts/{artifactId}/content:
    get:
      operationId: downloadArtifact
      tags: [Artifacts]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/ArtifactId'}
        - name: Range
          in: header
          required: false
          description: One RFC 9110 byte range, for example bytes=0-1023.
          schema: {type: string}
      responses:
        '200':
          description: Complete Artifact content
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            ETag: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            text/csv:
              schema: {type: string, format: binary}
        '206':
          description: Requested byte range
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            Content-Range: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            text/csv:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/system/maintenance/artifacts/retention:
    post:
      operationId: runArtifactRetention
      tags: [System, Artifacts]
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        '200':
          description: Expired, unpinned Artifacts claimed and deleted by this pass
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactCleanup'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/commands/pause:
    post:
      operationId: pauseRun
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/CommandAccepted'}
        '200': {$ref: '#/components/responses/CommandReplay'}
        '409': {$ref: '#/components/responses/CommandRejected'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/commands/resume:
    post:
      operationId: resumeRun
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/CommandAccepted'}
        '200': {$ref: '#/components/responses/CommandReplay'}
        '409': {$ref: '#/components/responses/CommandRejected'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/commands/cancel:
    post:
      operationId: cancelRun
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRun'}
      responses:
        '202': {$ref: '#/components/responses/CommandAccepted'}
        '200': {$ref: '#/components/responses/CommandReplay'}
        '409': {$ref: '#/components/responses/CommandRejected'}
  /api/v1/workspaces/{workspaceId}/runs/{runId}/commands/concurrency:
    post:
      operationId: changeRunConcurrency
      tags: [Runs]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeConcurrency'}
      responses:
        '202': {$ref: '#/components/responses/CommandAccepted'}
        '200': {$ref: '#/components/responses/CommandReplay'}
        '409': {$ref: '#/components/responses/CommandRejected'}
  /internal/agent/v1/enroll:
    post:
      operationId: enrollAgent
      tags: [Agent Internal]
      security: [{enrollmentAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentEnrollmentRequest'}}}
      responses:
        '201':
          description: Agent credential and mTLS certificate chain
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentCredential'}}}
  /internal/agent/v1/credentials/rotate:
    post:
      operationId: rotateAgentCredential
      tags: [Agent Internal]
      security: [{agentAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RotateAgentCredential'}}}
      responses:
        '200':
          description: Rotated Agent credential and certificate chain
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentCredential'}}}
  /internal/agent/v1/leases/{leaseId}/artifacts:
    post:
      operationId: planAgentArtifactUpload
      tags: [Agent Internal, Artifacts]
      security: [{agentHeaderAuth: []}]
      parameters: [{name: leaseId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlanAgentArtifact'}}}
      responses:
        '201':
          description: Signed upload plan, optionally directly targeting S3
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentArtifactUploadPlan'}}}
  /internal/agent/v1/leases/{leaseId}/execution-spec:
    get:
      operationId: downloadAgentExecutionSpec
      tags: [Agent Internal]
      security: [{agentHeaderAuth: []}]
      parameters: [{name: leaseId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Immutable canonical execution specification, content: {application/json: {schema: {type: object}}}}
  /internal/agent/v1/leases/{leaseId}/audience:
    get:
      operationId: downloadAgentAudience
      tags: [Agent Internal]
      security: [{agentHeaderAuth: []}]
      parameters: [{name: leaseId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Immutable audience snapshot, content: {application/json: {schema: {type: object}}}}
  /internal/agent/v1/artifacts/{artifactId}/content:
    put:
      operationId: uploadAgentArtifactContent
      tags: [Agent Internal, Artifacts]
      parameters:
        - {name: artifactId, in: path, required: true, schema: {type: string}}
        - {name: upload_token, in: query, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '200': {description: Content accepted; commit is still required, content: {application/json: {schema: {$ref: '#/components/schemas/AgentArtifactUploadResult'}}}}
  /internal/agent/v1/artifacts/{artifactId}/commit:
    post:
      operationId: commitAgentArtifact
      tags: [Agent Internal, Artifacts]
      parameters:
        - {name: artifactId, in: path, required: true, schema: {type: string}}
        - {name: upload_token, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Artifact checksum verified and READY, content: {application/json: {schema: {$ref: '#/components/schemas/AgentArtifactCommitResult'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    enrollmentAuth: {type: http, scheme: Enrollment}
    agentAuth: {type: http, scheme: Agent}
    agentHeaderAuth: {type: apiKey, in: header, name: x-wepush-agent-token}
  parameters:
    WorkspaceId: {name: workspaceId, in: path, required: true, schema: {type: string}}
    ProviderId: {name: providerId, in: path, required: true, schema: {type: string}}
    ProviderVersion: {name: version, in: path, required: true, schema: {type: string}}
    RunId: {name: runId, in: path, required: true, schema: {type: string}}
    ArtifactId: {name: artifactId, in: path, required: true, schema: {type: string}}
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque HMAC-protected cursor bound to the current filters.
      schema: {type: string}
    LimitQuery: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    NameQuery: {name: name, in: query, required: false, schema: {type: string}}
    StatusQuery: {name: status, in: query, required: false, schema: {type: string}}
    FromQuery: {name: from, in: query, required: false, schema: {type: string, format: date-time}}
    ToQuery: {name: to, in: query, required: false, schema: {type: string, format: date-time}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
  responses:
    BadRequest:
      description: Request or cursor is invalid
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AccountList:
      description: Accounts
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccountPage'}
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Resource or idempotency conflict
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: Provider or domain validation failed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    CommandAccepted:
      description: Command accepted by the active execution handle
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RunCommand'}
    CommandReplay:
      description: Previously accepted command returned idempotently
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RunCommand'}
    CommandRejected:
      description: Command reached Core but was rejected for the current Run state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RunCommand'}
  schemas:
    JsonObject: {type: object, additionalProperties: true}
    ResourceMetadata:
      type: object
      required: [id, workspaceId, name, createdAt, updatedAt, version]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    SystemInfo:
      type: object
      required: [product, version, mode, serverTime]
      properties:
        product: {type: string}
        version: {type: string}
        mode: {type: string}
        serverTime: {type: string, format: date-time}
    ProviderSummary:
      type: object
      required: [providerId, displayName, implementationVersion, capabilities, maximumConcurrency, links]
      properties:
        providerId: {type: string}
        displayName: {type: string}
        implementationVersion: {type: string}
        capabilities: {type: array, items: {type: string}, uniqueItems: true}
        maximumConcurrency: {type: integer, minimum: 1}
        links:
          type: object
          required: [accountSchema, messageSchema, recipientSchema]
          properties:
            accountSchema: {type: string}
            messageSchema: {type: string}
            recipientSchema: {type: string}
    AgentProvider:
      type: object
      required: [providerId, implementationVersion, spiMajor, maximumConcurrency]
      properties:
        providerId: {type: string}
        implementationVersion: {type: string}
        spiMajor: {type: integer, minimum: 1}
        maximumConcurrency: {type: integer, minimum: 1}
    Agent:
      type: object
      required: [id, status, agentVersion, protocolVersion, operatingSystem, architecture, javaVersion,
                 maximumRuns, activeRuns, availableRuns, providers, sessionId, lastAgentSequence,
                 lastServiceSequence, connectedAt, lastSeenAt, version, links]
      properties:
        id: {type: string}
        status: {type: string, enum: [ONLINE, DRAINING, DEGRADED, OFFLINE]}
        agentVersion: {type: string}
        protocolVersion: {type: integer, minimum: 1}
        operatingSystem: {type: string}
        architecture: {type: string}
        javaVersion: {type: string}
        maximumRuns: {type: integer, minimum: 1}
        activeRuns: {type: integer, minimum: 0}
        availableRuns: {type: integer, minimum: 0}
        providers: {type: array, items: {$ref: '#/components/schemas/AgentProvider'}}
        sessionId: {type: string}
        lastAgentSequence: {type: integer, format: int64, minimum: 1}
        lastServiceSequence: {type: integer, format: int64, minimum: 1}
        connectedAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        disconnectedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        links: {type: object, additionalProperties: {type: string}}
    CreateAccount:
      type: object
      required: [name, providerId, providerVersion, configuration]
      properties:
        name: {type: string}
        providerId: {type: string}
        providerVersion: {type: string}
        configuration: {$ref: '#/components/schemas/JsonObject'}
    Account:
      allOf:
        - {$ref: '#/components/schemas/ResourceMetadata'}
        - type: object
          required: [providerId, providerVersion, configuration, status]
          properties:
            providerId: {type: string}
            providerVersion: {type: string}
            configuration: {$ref: '#/components/schemas/JsonObject'}
            status: {type: string, enum: [ACTIVE, DISABLED, ARCHIVED]}
    UpdateAccount:
      type: object
      properties:
        name: {type: string}
        configuration: {$ref: '#/components/schemas/JsonObject'}
        status: {type: string, enum: [ACTIVE, DISABLED, ARCHIVED]}
    ConnectionTestRequest:
      type: object
      properties: {timeout: {type: string, format: duration, default: PT10S}}
    ConnectionTest:
      type: object
      required: [successful, code, diagnostic, latencyMillis]
      properties:
        successful: {type: boolean}
        code: {type: string}
        diagnostic: {type: string}
        latencyMillis: {type: integer, format: int64, minimum: 0}
    SecretWrite:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          writeOnly: true
    SecretMetadata:
      type: object
      required: [workspaceId, namespace, name, secretVersion, configured, recordVersion, createdAt, updatedAt]
      properties:
        workspaceId: {type: string}
        namespace: {type: string}
        name: {type: string}
        secretVersion: {type: string}
        configured: {type: boolean}
        recordVersion: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateMessage:
      type: object
      required: [name, providerId, providerVersion, content]
      properties:
        name: {type: string}
        providerId: {type: string}
        providerVersion: {type: string}
        content: {$ref: '#/components/schemas/JsonObject'}
    Message:
      allOf:
        - {$ref: '#/components/schemas/ResourceMetadata'}
        - type: object
          required: [providerId, providerVersion, revision, schemaVersion, content, contentHash, status]
          properties:
            providerId: {type: string}
            providerVersion: {type: string}
            revision: {type: integer, minimum: 1}
            schemaVersion: {type: string}
            content: {$ref: '#/components/schemas/JsonObject'}
            contentHash: {type: string}
            status: {type: string, enum: [ACTIVE, DISABLED, ARCHIVED]}
    UpdateMessage:
      type: object
      properties:
        name: {type: string}
        content: {$ref: '#/components/schemas/JsonObject'}
        status: {type: string, enum: [ACTIVE, DISABLED, ARCHIVED]}
    CopyResource:
      type: object
      required: [name]
      properties: {name: {type: string}}
    MessageRevision:
      type: object
      required: [messageId, revision, schemaVersion, content, contentHash, createdAt]
      properties:
        messageId: {type: string}
        revision: {type: integer, minimum: 1}
        schemaVersion: {type: string}
        content: {$ref: '#/components/schemas/JsonObject'}
        contentHash: {type: string}
        createdAt: {type: string, format: date-time}
    MessageRevisionPage:
      type: object
      required: [items, hasMore]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MessageRevision'}}
        nextBeforeRevision: {type: [integer, 'null'], minimum: 1}
        hasMore: {type: boolean}
    MessageDiff:
      type: object
      required: [from, to, changedPaths]
      properties:
        from: {$ref: '#/components/schemas/MessageRevision'}
        to: {$ref: '#/components/schemas/MessageRevision'}
        changedPaths: {type: array, items: {type: string}}
    Recipient:
      type: object
      required: [fields]
      properties:
        itemId: {type: string}
        fields: {$ref: '#/components/schemas/JsonObject'}
    CreateAudience:
      type: object
      required: [name, recipients]
      properties:
        name: {type: string}
        recipients: {type: array, items: {$ref: '#/components/schemas/Recipient'}}
    Audience:
      allOf:
        - {$ref: '#/components/schemas/ResourceMetadata'}
        - type: object
          required: [snapshotId, revision, recordCount, contentHash, status]
          properties:
            snapshotId: {type: string}
            revision: {type: integer, minimum: 1}
            recordCount: {type: integer, format: int64, minimum: 0}
            contentHash: {type: string}
            status: {type: string, enum: [ACTIVE, DISABLED, ARCHIVED]}
    UpdateAudience:
      type: object
      properties:
        name: {type: string}
        recipients: {type: array, items: {$ref: '#/components/schemas/Recipient'}}
        status: {type: string, enum: [ACTIVE, DISABLED, ARCHIVED]}
    AudienceImportRow:
      type: object
      required: [sequence, itemId, fields, rawLine, accepted, errorCode, errorMessage]
      properties:
        sequence: {type: integer, format: int64, minimum: 1}
        itemId: {type: string}
        fields: {$ref: '#/components/schemas/JsonObject'}
        rawLine: {type: string}
        accepted: {type: boolean}
        errorCode: {type: string}
        errorMessage: {type: string}
    AudienceImport:
      type: object
      required: [id, workspaceId, name, format, itemIdColumn, fieldMapping, status, totalRows,
                 acceptedRows, rejectedRows, duplicateRows, acceptedPreview, errorPreview,
                 createdAt, updatedAt, errorsUrl]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        audienceId: {type: [string, 'null']}
        name: {type: string}
        format: {type: string, enum: [CSV, TXT]}
        itemIdColumn: {type: string}
        fieldMapping: {$ref: '#/components/schemas/JsonObject'}
        status: {type: string, enum: [UPLOADING, PREVIEW_READY, COMMITTED]}
        totalRows: {type: integer, format: int64, minimum: 0}
        acceptedRows: {type: integer, format: int64, minimum: 0}
        rejectedRows: {type: integer, format: int64, minimum: 0}
        duplicateRows: {type: integer, format: int64, minimum: 0}
        acceptedPreview: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/AudienceImportRow'}}
        errorPreview: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/AudienceImportRow'}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        errorsUrl: {type: string}
    CreateJob:
      type: object
      required: [name, accountId, messageId, audienceId]
      properties:
        name: {type: string}
        accountId: {type: string}
        messageId: {type: string}
        audienceId: {type: string}
        policies: {$ref: '#/components/schemas/JsonObject'}
        enabled: {type: boolean, default: true}
    Job:
      allOf:
        - {$ref: '#/components/schemas/ResourceMetadata'}
        - type: object
          required: [accountId, messageId, audienceId, policies, enabled, archived, status]
          properties:
            accountId: {type: string}
            messageId: {type: string}
            audienceId: {type: string}
            policies: {$ref: '#/components/schemas/JsonObject'}
            enabled: {type: boolean}
            archived: {type: boolean}
            status: {type: string, enum: [ACTIVE, DISABLED, ARCHIVED]}
    UpdateJob:
      type: object
      properties:
        name: {type: string}
        accountId: {type: string}
        messageId: {type: string}
        audienceId: {type: string}
        policies: {$ref: '#/components/schemas/JsonObject'}
        enabled: {type: boolean}
        archived: {type: boolean}
    CreateRun:
      type: object
      properties:
        dryRun: {type: boolean, default: false}
        policyOverrides: {$ref: '#/components/schemas/JsonObject'}
        reason: {type: string, default: manual}
        confirmationToken: {type: string, description: Required for non-dry manual Runs.}
    LiveConfirmation:
      type: object
      required: [jobId, jobName, providerId, providerVersion, accountId, accountName, audienceId,
                 audienceName, audienceCount, policies, targetConcurrency, rateLimitPermits,
                 rateLimitPeriod, estimatedItems, expiresAt, confirmationToken]
      properties:
        jobId: {type: string}
        jobName: {type: string}
        providerId: {type: string}
        providerVersion: {type: string}
        accountId: {type: string}
        accountName: {type: string}
        audienceId: {type: string}
        audienceName: {type: string}
        audienceCount: {type: integer, format: int64, minimum: 0}
        policies: {$ref: '#/components/schemas/JsonObject'}
        targetConcurrency: {type: integer, minimum: 1}
        rateLimitPermits: {type: integer, format: int64, minimum: 1}
        rateLimitPeriod: {type: string, format: duration}
        estimatedItems: {type: integer, format: int64, minimum: 0}
        expiresAt: {type: string, format: date-time}
        confirmationToken: {type: string}
    RetryRequest:
      type: object
      required: [states]
      properties:
        states: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [FAILED, UNKNOWN, UNSENT]}}
        confirmationToken: {type: string}
    RetryConfirmation:
      type: object
      required: [sourceRunId, states, itemCount, expiresAt, confirmationToken]
      properties:
        sourceRunId: {type: string}
        states: {type: array, items: {type: string, enum: [FAILED, UNKNOWN, UNSENT]}, uniqueItems: true}
        itemCount: {type: integer, format: int64, minimum: 1}
        expiresAt: {type: string, format: date-time}
        confirmationToken: {type: string}
    RunCounters:
      type: object
