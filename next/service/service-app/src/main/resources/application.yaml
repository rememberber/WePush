spring:
  application:
    name: wepush-next-service

server:
  address: ${WEPUSH_BIND_ADDRESS:127.0.0.1}
  port: ${WEPUSH_PORT:18990}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

wepush:
  mode: ${WEPUSH_MODE:standalone}
  database:
    path: ${WEPUSH_DATABASE_PATH:.local/data/wepush-next.db}
  secret:
    master-key-path: ${WEPUSH_MASTER_KEY_PATH:.local/secrets/master-key.json}
    master-key-base64: ${WEPUSH_MASTER_KEY_BASE64:}
