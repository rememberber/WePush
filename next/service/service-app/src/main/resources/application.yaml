spring:
  application:
    name: wepush-next-service

server:
  address: ${WEPUSH_BIND_ADDRESS:127.0.0.1}
  port: ${WEPUSH_PORT:18990}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

wepush:
  mode: ${WEPUSH_MODE:standalone}
  database:
    path: ${WEPUSH_DATABASE_PATH:.local/data/wepush-next.db}
  secret:
    master-key-path: ${WEPUSH_MASTER_KEY_PATH:.local/secrets/master-key.json}
    master-key-base64: ${WEPUSH_MASTER_KEY_BASE64:}
  artifact:
    root: ${WEPUSH_ARTIFACT_ROOT:.local/artifacts}
    environment: ${WEPUSH_ENVIRONMENT:standalone}
    export-retention: ${WEPUSH_EXPORT_RETENTION:PT24H}
    retention-initial-delay: ${WEPUSH_RETENTION_INITIAL_DELAY:PT1M}
    retention-interval: ${WEPUSH_RETENTION_INTERVAL:PT1H}
  agent:
    grpc:
      address: ${WEPUSH_AGENT_GRPC_ADDRESS:127.0.0.1}
      port: ${WEPUSH_AGENT_GRPC_PORT:19090}
      token: ${WEPUSH_AGENT_GRPC_TOKEN:}
      heartbeat-interval: ${WEPUSH_AGENT_HEARTBEAT_INTERVAL:PT10S}
      maximum-message-bytes: ${WEPUSH_AGENT_MAXIMUM_MESSAGE_BYTES:1048576}
