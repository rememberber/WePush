apiVersion: v1
kind: Service
metadata:
  name: wepush-next
spec:
  selector:
    app.kubernetes.io/name: wepush-next-service
  ports:
    - name: http
      port: 18990
      targetPort: http
    - name: agent-grpc
      port: 19090
      targetPort: agent-grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wepush-next-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wepush-next-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wepush-next-service
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: ghcr.io/rememberber/wepush-next-service:1.1.0
          ports:
            - { name: http, containerPort: 18990 }
            - { name: agent-grpc, containerPort: 19090 }
          envFrom:
            - configMapRef: { name: wepush-next }
            - secretRef: { name: wepush-next-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: agent-ca, mountPath: /var/lib/wepush/agent-ca, readOnly: true }
            - { name: agent-tls, mountPath: /var/lib/wepush/tls, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: agent-ca
          secret: { secretName: wepush-next-agent-ca }
        - name: agent-tls
          secret: { secretName: wepush-next-agent-tls }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wepush-next-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wepush-next-service
