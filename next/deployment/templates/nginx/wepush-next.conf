map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream wepush_next_service {
    least_conn;
    server service-1:18990;
    server service-2:18990;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name wepush.example.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location /api/v1/ {
        proxy_pass http://wepush_next_service;
    }

    location ~ ^/api/v1/workspaces/[^/]+/runs/[^/]+/events$ {
        proxy_pass http://wepush_next_service;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35m;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://wepush_next_service;
    }
}
