name: WePush Next CI

on:
  push:
    paths:
      - 'next/**'
      - '.github/workflows/next-ci.yml'
      - '.github/workflows/next-release.yml'
      - '.github/workflows/next-soak.yml'
  pull_request:
    paths:
      - 'next/**'
      - '.github/workflows/next-ci.yml'
      - '.github/workflows/next-release.yml'
      - '.github/workflows/next-soak.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Java, SQLite and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Next reactor
        working-directory: next
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -pl '!distribution' verify

  postgres:
    name: PostgreSQL 18 migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: wepush
          POSTGRES_USER: wepush
          POSTGRES_PASSWORD: wepush-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wepush"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      WEPUSH_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/wepush
      WEPUSH_TEST_POSTGRES_USERNAME: wepush
      WEPUSH_TEST_POSTGRES_PASSWORD: wepush-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify PostgreSQL schema
        working-directory: next
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -pl service/service-app -am
          -Dtest=PostgreSQLMigrationIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  artifact-store:
    name: S3-compatible Artifact Store
    runs-on: ubuntu-latest
    env:
      WEPUSH_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      WEPUSH_TEST_S3_ACCESS_KEY: wepush-test
      WEPUSH_TEST_S3_SECRET_KEY: wepush-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start pinned MinIO
        run: >-
          docker run --detach --name wepush-next-minio -p 9000:9000
          -e MINIO_ROOT_USER=wepush-test
          -e MINIO_ROOT_PASSWORD=wepush-test-secret
          quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: Wait for MinIO
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs wepush-next-minio
          exit 1
      - name: Verify S3 protocol and multipart path
        working-directory: next
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -pl service/service-infrastructure -am
          -Dtest=S3ArtifactStoreIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  ui:
    name: Web and Desktop UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.22.0
      - name: Install UI dependencies
        working-directory: next/ui
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test and build UI
        working-directory: next/ui
        run: pnpm check
      - name: Install Chromium for browser E2E
        working-directory: next/ui
        run: pnpm --filter @wepush-next/web exec playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: next/ui
        run: pnpm --filter @wepush-next/web e2e

  desktop-and-platform-scripts:
    name: Desktop and installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.22.0
      - name: Install UI dependencies
        working-directory: next/ui
        run: pnpm install --frozen-lockfile
      - name: Install pinned Electron runtime
        working-directory: next/ui
        run: node apps/desktop/node_modules/electron/install.js
      - name: Package native Desktop shell
        working-directory: next/ui
        run: pnpm --filter @wepush-next/desktop package
      - name: Validate Unix installers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          find next/distribution/src/main/distribution -type f -name '*.sh' -print0 |
            xargs -0 -n1 sh -n
          next/distribution/src/test/operations-self-test.sh
      - name: Validate launchd units and macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find next/distribution/src/main/distribution/install/macos -type f -name '*.plist' -print0 |
            xargs -0 -n1 plutil -lint
          test -f 'next/ui/apps/desktop/release/WePush Next.app/Contents/Info.plist'
          codesign --verify --deep --strict --verbose=2 'next/ui/apps/desktop/release/WePush Next.app'
          WEPUSH_DESKTOP_SMOKE_TEST=true 'next/ui/apps/desktop/release/WePush Next.app/Contents/MacOS/WePush Next'
      - name: Validate Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x next/ui/apps/desktop/release/linux-unpacked/wepush-next
          xvfb-run -a env WEPUSH_DESKTOP_SMOKE_TEST=true next/ui/apps/desktop/release/linux-unpacked/wepush-next
      - name: Validate PowerShell, WinSW XML and Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem next/distribution/src -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            }
          }
          Get-ChildItem next/distribution/src/main/distribution/install/windows -Filter *.xml | ForEach-Object {
            try { [xml](Get-Content $_.FullName -Raw) | Out-Null } catch { Write-Error $_; $failed = $true }
          }
          if (-not (Test-Path 'next/ui/apps/desktop/release/win-unpacked/WePush Next.exe')) {
            Write-Error 'Packaged Windows application is missing'
            $failed = $true
          }
          if ($failed) { exit 1 }
          & next/distribution/src/test/operations-self-test.ps1
          $env:WEPUSH_DESKTOP_SMOKE_TEST = 'true'
          $process = Start-Process 'next/ui/apps/desktop/release/win-unpacked/WePush Next.exe' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Desktop smoke check failed with exit code $($process.ExitCode)" }

  distribution:
    name: Distribution archives
    needs: [java, ui, postgres, artifact-store, desktop-and-platform-scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.22.0
      - name: Build WebUI
        working-directory: next/ui
        run: pnpm install --frozen-lockfile && pnpm --filter @wepush-next/web build
      - name: Prepare pinned offline Windows service wrapper
        run: next/scripts/prepare-winsw.sh
      - name: Build release archives after verified jobs
        working-directory: next
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify checksums and required release content
        working-directory: next/distribution/target
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check *.sha256
          tar_archive=$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)
          zip_archive=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$tar_archive" && test -n "$zip_archive"
          tar_listing=$(tar -tzf "$tar_archive")
          grep -Eq '^wepush-next-[^/]+/web/index.html$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/docs/user-guide.md$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/LICENSE.txt$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/PREVIEW-NOTICE.md$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/SECURITY.md$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/api/openapi.yaml$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/sdk/sdk-java-[^/]+\.jar$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/sdk/embedded-java-[^/]+\.jar$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/sdk/provider-http-[^/]+\.jar$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/sdk/provider-standard-[^/]+\.jar$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/install/windows/WinSW-x64\.exe$' <<< "$tar_listing"
          grep -Eq '^wepush-next-[^/]+/install/windows/WinSW-NOTICE\.txt$' <<< "$tar_listing"
          unzip -t "$zip_archive"
      - uses: actions/upload-artifact@v4
        with:
          name: wepush-next-distribution
          path: |
            next/distribution/target/*.tar.gz
            next/distribution/target/*.zip
            next/distribution/target/*.sha256
          if-no-files-found: error
          retention-days: 14

  bundled-runtime-packages:
    name: Bundled Java runtime (${{ matrix.platform }})
    needs: distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: wepush-next-distribution
          path: slim
      - name: Build and verify Unix bundled-runtime archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find slim -maxdepth 1 -name '*.tar.gz' -print -quit)
          mkdir staging output
          tar -xzf "$archive" -C staging
          root=$(find staging -mindepth 1 -maxdepth 1 -type d -print -quit)
          "$JAVA_HOME/bin/jlink" --add-modules ALL-MODULE-PATH --strip-debug --no-header-files --no-man-pages --compress=2 --output "$root/runtime"
          "$root/runtime/bin/java" -version
          machine=$(uname -m)
          case "$machine" in x86_64) arch=x64;; arm64|aarch64) arch=arm64;; *) arch=$machine;; esac
          version=$(basename "$root" | sed 's/^wepush-next-//')
          if [ "${{ matrix.platform }}" = macos ]; then
            ditto -c -k --sequesterRsrc --keepParent "$root" "output/wepush-next-$version-macos-$arch.zip"
          else
            tar -C staging -czf "output/wepush-next-$version-linux-$arch.tar.gz" "$(basename "$root")"
          fi
      - name: Build and verify Windows bundled-runtime archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem slim -Filter *.zip |
            Where-Object { $_.Name -notlike '*java-sdk*' } |
            Select-Object -First 1
          if (-not $archive) { throw 'Slim Windows distribution archive not found' }
          New-Item -ItemType Directory -Force -Path staging,output | Out-Null
          Expand-Archive $archive.FullName staging
          $root = Get-ChildItem staging -Directory | Select-Object -First 1
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules ALL-MODULE-PATH --strip-debug --no-header-files --no-man-pages --compress=2 --output "$($root.FullName)\runtime"
          & "$($root.FullName)\runtime\bin\java.exe" -version
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $version = $root.Name -replace '^wepush-next-', ''
          Compress-Archive $root.FullName "output\wepush-next-$version-windows-$arch.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: wepush-next-runtime-${{ matrix.platform }}
          path: output/*
          if-no-files-found: error
          retention-days: 14
